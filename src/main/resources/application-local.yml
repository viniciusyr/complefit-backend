spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

api:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration-hours: 2

exercisedb:
  api-url: https://exercisedb.p.rapidapi.com
  api-key: ${EXERCISEDB_API_KEY:your-api-key-here}
  api-host: exercisedb.p.rapidapi.com

